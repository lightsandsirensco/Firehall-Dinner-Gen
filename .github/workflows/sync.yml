name: Sync to GitHub

# Manual only. A plain (non-force) push fails instead of overwriting history
# if lightsandsirensco/firehall-meal-generator has diverged from this repo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to lightsandsirensco/firehall-meal-generator
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add target https://x-access-token:${SYNC_PAT}@github.com/lightsandsirensco/firehall-meal-generator.git
          git push target HEAD:main
