name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit summary (moderate, non-blocking)
        run: npm audit --omit=dev --audit-level=moderate || true
