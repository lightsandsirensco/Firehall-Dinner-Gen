# P0 — Weekly batch: trend JSON → staging → recipe_catalog (Explore reads catalog only)
name: Ingest recipe discovery

on:
  schedule:
    # Sundays 06:00 UTC
    - cron: "0 6 * * 0"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Optional Apify trend export
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_DATASET_ID: ${{ secrets.APIFY_DATASET_ID }}
          APIFY_ACTOR_RUN_ID: ${{ secrets.APIFY_ACTOR_RUN_ID }}
        run: npx tsx scripts/apify-export-trends.ts --merge
        continue-on-error: true

      - name: Run Pinterest ingestion (stage + promote)
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_DATASET_ID: ${{ secrets.APIFY_DATASET_ID }}
          SPOONACULAR_API_KEY: ${{ secrets.SPOONACULAR_API_KEY }}
        run: npm run ingest:pinterest -- --promote

      - name: Upload trend signals artifact
        uses: actions/upload-artifact@v4
        with:
          name: trend-signals
          path: data/ingestion/trend-signals.json
          if-no-files-found: ignore
