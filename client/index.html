    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Non-render-blocking Google Fonts load: `media="print"` makes the browser
      fetch the stylesheet without gating first paint on it, then the `onload`
      swap flips it to `all` once it's ready. `&display=swap` still applies so
      text renders in a fallback font in the meantime instead of staying
      invisible. <noscript> covers browsers/bots that don't run the onload JS.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!--
      Static site-level structured data — the fallback Organization/WebSite
      entities for any route the server-side injectors (generic-page-injection.ts /
      recipe-html-injection.ts) don't cover (private/app-shell client routes).
      Every crawler — including AI bots and social unfurlers — sees them on
      the very first byte even before those injectors run.

      WebSite: enables the Google Sitelinks Search Box and confirms site identity.
      Organization: establishes the brand entity for Knowledge Panel eligibility.

      IMPORTANT — audited in SEO Phase 5 (duplicate JSON-LD): a prior version
      of this comment claimed the per-route injectors emitting Organization/
      WebSite again "is fine — duplicate JSON-LD blocks are ignored by
      parsers." That's false — parsers register every `<script
      type="application/ld+json">` block, so two Organization/WebSite
      entities describing the identical entity really did produce duplicate
      structured data on every route whose own jsonLd also included one of
      these types. `injectJsonLdIntoHtml` (see `server/seo/apply-seo-tags.ts`)
      now strips whichever of these two `@graph` entries a route supplies
      itself before injecting that route's own JSON-LD, using this
      `id="fh-default-jsonld"` marker to find this block — so exactly one
      Organization and one WebSite entity ever exists per page: the
      route-specific one when the route provides it, this static fallback
      otherwise.
    -->
    <script type="application/ld+json" id="fh-default-jsonld">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Firehall Meals",
          "alternateName": ["FirehallMeals", "Firefighter Recipes", "Firehouse Meals"],
          "url": "https://www.firehallmeals.com/",
          "inLanguage": "en-US",
          "description": "Firehouse recipes and firefighter dinner ideas built for busy shifts — crew-sized portions, grocery lists and meal planning your whole crew will eat.",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://www.firehallmeals.com/explore?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "name": "Firehall Meals",
          "alternateName": "FirehallMeals",
          "url": "https://www.firehallmeals.com/",
          "description": "Firehouse recipes and firefighter dinner ideas built for busy shifts — crew-sized portions, grocery lists and meal planning your whole crew will eat.",
          "knowsAbout": [
            "firehouse recipes",
            "firehouse meals",
            "firefighter recipes",
            "firefighter dinner ideas",
            "fire station meals",
            "meals for firefighters",
            "firehouse cooking",
            "firefighter meal planning",
            "firefighter meals",
            "crew meals",
            "healthy firefighter meals",
            "firefighter breakfast recipes",
            "firehall meals"
          ]
        }
      ]
    }
    </script>
